<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foamico Gallery — Dealer Registration Prototype</title>
<link rel="icon" type="image/jpeg" href="favicon.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#1A1A1A; --charcoal:#2B2B2B; --kiwi:#95C12B; --avocado:#3F5E12;
  --calm:#E4F2C5; --sand:#9D9E9E; --egg:#FEFEFE; --slate:#6B6B6B;
  --lgrey:#DDDDDD; --mist:#F2F4EC; --paper:#F6F8F1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--mist);color:var(--black);-webkit-font-smoothing:antialiased}

.topbar{background:var(--black);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mark{font-family:Montserrat;font-weight:800;font-size:17px;color:var(--egg);letter-spacing:.14em}
.mark span{color:var(--kiwi)}
.kick{font-size:10px;letter-spacing:.18em;color:var(--kiwi);font-family:Montserrat;font-weight:500;text-transform:uppercase}

.wrap{max-width:900px;margin:0 auto;padding:34px 20px 60px;display:flex;gap:34px;align-items:flex-start;justify-content:center}

.device{width:330px;flex:0 0 330px;background:var(--egg);border:1px solid var(--lgrey);border-radius:22px;overflow:hidden}
.dhead{background:var(--black);padding:15px 18px}
.dstep{font-size:10px;letter-spacing:.16em;color:var(--kiwi);font-family:Montserrat;font-weight:500;text-transform:uppercase}
.dtitle{font-family:Montserrat;font-weight:700;font-size:16px;color:var(--egg);margin-top:3px}
.track{height:3px;background:var(--avocado);border-radius:2px;margin-top:12px}
.fill{height:3px;background:var(--kiwi);border-radius:2px;width:12%;transition:width .3s ease}
.dbody{padding:18px;background:var(--paper);min-height:430px}

label,.lab{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin:0 0 6px;line-height:1.5}
.req{color:var(--avocado)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date]{width:100%;background:var(--egg);border:1px solid var(--lgrey);border-radius:9px;padding:10px 11px;font-family:Poppins;font-size:13.5px;color:var(--black);margin:0 0 14px}
input:focus{outline:none;border-color:var(--kiwi);box-shadow:0 0 0 3px rgba(149,193,43,.2)}
input::placeholder{color:var(--sand)}
input:disabled{background:var(--mist);color:var(--sand)}
.err{border-color:#C0392B !important;box-shadow:0 0 0 3px rgba(192,57,43,.15) !important}
.errbanner{background:#FBEAEA;border:1px solid #C0392B;color:#C0392B;border-radius:9px;padding:10px 12px;margin:0 0 14px;font-size:12px;line-height:1.5}
.row{display:flex;gap:9px}
.row>div{flex:1;min-width:0}

.info{background:var(--calm);border-radius:9px;padding:11px 12px;margin:0 0 14px;font-size:12px;color:var(--avocado);line-height:1.65}
.info strong{font-weight:500}
.plain{background:var(--egg);border:1px solid var(--lgrey);color:var(--black)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.chip{border:1px solid var(--lgrey);background:var(--egg);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--slate);cursor:pointer;user-select:none;transition:all .12s}
.chip:hover{border-color:var(--sand)}
.chip.on{background:var(--kiwi);border-color:var(--kiwi);color:var(--black)}

.doclink{font-size:11.5px;color:var(--avocado);text-decoration:underline;cursor:pointer;user-select:none}
.doclink:hover{color:var(--kiwi)}

.hero{background:var(--black);border-radius:14px;padding:17px;margin:0 0 14px}
.hero b{display:block;font-family:Montserrat;font-weight:800;font-size:32px;color:var(--kiwi);line-height:1.25}
.hero p{font-size:12px;color:var(--egg);line-height:1.65;margin-top:7px}

.rsec-title{font-family:Montserrat;font-weight:700;font-size:12px;color:var(--black);margin:4px 0 12px;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.rwd{display:flex;gap:11px;margin:0 0 14px}
.rwd .num{width:24px;height:24px;border-radius:50%;background:var(--kiwi);color:var(--black);font-family:Montserrat;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.rwd .rtext b{display:block;font-family:Montserrat;font-weight:700;font-size:12.5px;color:var(--black);margin-bottom:2px}
.rwd .rtext p{font-size:11.5px;color:var(--slate);line-height:1.5}

.declare{display:flex;gap:11px;background:var(--calm);border-radius:9px;padding:13px;margin:0 0 14px;cursor:pointer;border:1px solid transparent}
.declare.err{border-color:var(--avocado)}
.cbox{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--avocado);border-radius:4px;background:var(--egg);margin-top:1px;position:relative}
.declare.on .cbox{background:var(--kiwi);border-color:var(--kiwi)}
.declare.on .cbox::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--black);border-width:0 2px 2px 0;transform:rotate(45deg)}
.dtext{font-size:11.5px;color:var(--avocado);line-height:1.65}

.summary{background:var(--egg);border:1px solid var(--lgrey);border-radius:9px;padding:12px;margin:0 0 14px;font-size:12.5px;line-height:1.75}
.summary em{font-style:normal;color:var(--slate)}

.cta{width:100%;background:var(--kiwi);color:var(--black);border:0;border-radius:999px;padding:13px;font-family:Poppins;font-weight:500;font-size:13.5px;cursor:pointer}
.cta:hover{background:#89b325}
.cta:disabled{background:var(--lgrey);color:var(--sand);cursor:not-allowed}
.back{background:none;border:0;color:var(--slate);font-family:Poppins;font-size:12px;cursor:pointer;padding:10px 0 0;display:block;margin:0 auto}

.hidden{display:none}

.done-wrap{text-align:center;padding:26px 6px}
.done-ring{width:58px;height:58px;border-radius:50%;background:var(--kiwi);margin:0 auto 18px;position:relative}
.done-ring::after{content:"";position:absolute;left:21px;top:15px;width:11px;height:22px;border:solid var(--black);border-width:0 3px 3px 0;transform:rotate(45deg)}
.done-wrap h4{font-family:Montserrat;font-weight:800;font-size:19px;margin-bottom:8px}
.done-wrap p{font-size:12.5px;color:var(--slate);line-height:1.7;margin-bottom:18px}
.wa{background:var(--egg);border:1px solid var(--lgrey);border-radius:9px;padding:13px;text-align:left;font-size:12px;line-height:1.7;color:var(--black)}
.wa span{color:var(--sand);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-family:Montserrat;font-weight:500}

.foot{text-align:center;font-size:11px;color:var(--sand);padding:0 20px 34px}

@media (max-width:480px){
  .wrap{padding:18px 0 30px}
  .device{width:100%;max-width:none;border-radius:0;border:0}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">FOAMICO<span>.</span></div>
  <div class="kick">Gallery enrolment · prototype</div>
</div>

<div class="wrap">
<div class="device">
  <div class="dhead">
    <div class="dstep" id="stepno">Step 1 of 6</div>
    <div class="dtitle" id="steptitle">Verify your number</div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="dbody" id="body"></div>
</div>
</div>

<p class="foot">FOAMICO · From the house of LPPL · Legend Polyfoams Pvt. Ltd. · Gallery enrolment prototype FY 2026–27</p>

<script>
var lang = 'en';
var step = 0;
var state = {
  confirmed: false, unmarried: false, accept: false, fields: {},
  mobileVerified: false, verifiedMobile: null, verifyToken: null, verifyTokenExpiresAt: null,
  verifiedPincode: null, pincodeDistrict: null, pincodeState: null
};
var PROGRESS_KEY = 'foamicoWizardProgress_v1';

var T = {
  cont:      ['Continue', 'आगे बढ़ें'],
  back:      ['Back', 'पीछे'],
  req:       [' · required', ' · आवश्यक'],
  stepof:    ['Step # of @', 'चरण # / @'],
  errmsg:    ['Please check the highlighted fields before continuing.', 'कृपया आगे बढ़ने से पहले हाइलाइट किए गए फ़ील्ड जाँचें।']
};
function t(k){ return T[k][lang === 'en' ? 0 : 1]; }

var STEPS = [
{
  title: ['Verify your number', 'अपना नंबर सत्यापित करें'],
  html: function(){
   var mobile = state.fields['f-mobile'] || '';
   var verified = state.mobileVerified && state.verifiedMobile === digitsOnly(mobile);
   return ''
   + card('plain', ['Become a Foamico Authorised Partner and unlock free mattress pairs, marketing support and the International Foamico Vision Trip.',
                    'फोमिको अधिकृत पार्टनर बनें और मुफ़्त गद्दे के जोड़े, मार्केटिंग सहायता और इंटरनेशनल फोमिको विज़न ट्रिप अनलॉक करें।'])
   + lab(['Your mobile number (WhatsApp)', 'आपका मोबाइल नंबर (व्हाट्सएप)'], true)
   + mobileInput()
   + '<span class="doclink" id="sendCodeBtn" onclick="sendOtp()">' + (lang==='en' ? 'Send code' : 'कोड भेजें') + '</span>'
   + '<div id="otpSendStatus" style="font-size:11px;margin:4px 0 8px;min-height:14px;color:var(--avocado)"></div>'
   + lab(['Enter the 6-digit code we sent', 'भेजा गया 6 अंकों का कोड डालें'], false)
   + otpInput()
   + '<div id="otpVerifyStatus" style="font-size:11px;margin:4px 0 8px;min-height:14px;color:var(--avocado)"></div>'
   + '<div id="mobileVerifiedCard"' + (verified ? '' : ' style="display:none"') + '>'
   + card('', ['<strong>Number verified.</strong> This is the only code you will be asked for.',
               '<strong>नंबर सत्यापित हुआ।</strong> आपसे केवल यही कोड माँगा जाएगा।'])
   + '</div>'
   + lab(['Which language do you prefer?', 'आप कौन सी भाषा पसंद करेंगे?'], false)
   + '<div class="chips" id="langChips">'
   + '<span class="chip' + (lang === 'en' ? ' on' : '') + '" onclick="setLang(\'en\')">English</span>'
   + '<span class="chip' + (lang === 'hi' ? ' on' : '') + '" onclick="setLang(\'hi\')">हिंदी</span>'
   + '</div>';
  },
  validate: function(){
   var errs = [];
   var mobile = digitsOnly(getVal('f-mobile'));
   if (mobile.length !== 10){ errs.push('f-mobile'); return errs; }
   // OTP verification temporarily not required to continue — re-enable the
   // f-otp check below once MSG91 sending is confirmed working end to end.
   // if (!state.mobileVerified || state.verifiedMobile !== mobile) errs.push('f-otp');
   return errs;
  }
},
{
  title: ['Owner details', 'मालिक का विवरण'],
  html: function(){
   var pincodeVal = state.fields['f-pincode'] || '';
   var pincodeFound = state.verifiedPincode && state.verifiedPincode === pincodeVal;
   return ''
   + lab(["Owner's full name", 'मालिक का पूरा नाम'], true)
   + txt('f-ownername', 'text', 'Ramesh Gupta')
   + '<div class="row"><div>' + lab(['Date of birth','जन्म तिथि'], true) + txt('f-dob', 'date', '') + '</div>'
   + '<div>' + lab(['Anniversary','सालगिरह'], !state.unmarried)
     + txt('f-anniv', 'date', '', state.unmarried ? ' disabled' : '') + '</div></div>'
   + '<div class="chips" id="marriedGroup" style="justify-content:center">'
   + '<span class="chip' + (state.unmarried ? ' on' : '') + '" onclick="toggleMarried()">' + (lang==='en'?'Unmarried':'अविवाहित') + '</span></div>'
   + '<div class="row"><div>' + lab(['Alternate Number','वैकल्पिक नंबर'], false) + txt('f-altnum', 'tel', '99887 76655') + '</div>'
   + '<div>' + lab(['Email','ईमेल'], true) + txt('f-email', 'email', 'ramesh.gupta@example.com') + '</div></div>'
   + lab(['Pincode', 'पिन कोड'], true)
   + pincodeInput()
   + '<div id="pincodeStatus" style="font-size:11px;margin:2px 0 6px;min-height:14px;color:var(--avocado)"></div>'
   + '<div id="pincodeResultCard"' + (pincodeFound ? '' : ' style="display:none"') + '>'
   + (pincodeFound ? card('', [
       escAttr(state.pincodeDistrict) + ' · ' + escAttr(state.pincodeState),
       escAttr(state.pincodeDistrict) + ' · ' + escAttr(state.pincodeState)
     ]) : '')
   + '</div>'
   + lab(['Firm Address', 'फर्म का पता'], true)
   + txt('f-address', 'text', '14/3 Rana Pratap Marg')
   + lab(['Landmark', 'पास की पहचान'], true)
   + txt('f-landmark', 'text', 'Behind Sahara Ganj');
  },
  validate: function(){
   var errs = [];
   if (!getVal('f-ownername')) errs.push('f-ownername');
   if (!getVal('f-dob')) errs.push('f-dob');
   if (!state.unmarried && !getVal('f-anniv')) errs.push('f-anniv');
   if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(getVal('f-email'))) errs.push('f-email');
   if (digitsOnly(getVal('f-pincode')).length !== 6) errs.push('f-pincode');
   if (!getVal('f-address')) errs.push('f-address');
   if (!getVal('f-landmark')) errs.push('f-landmark');
   return errs;
  }
},
{
  title: ['Your shop', 'आपकी दुकान'],
  html: function(){ return ''
   + lab(['Size of your shop', 'दुकान का आकार'], false)
   + chips('size', [['Under 200','200 से कम'],['200–500','200–500'],['500–1000','500–1000'],['1000+ sq ft','1000+ वर्ग फुट']], -1)
   + lab(['How many Display Mattresses do you require?', 'आपको कितने डिस्प्ले गद्दे चाहिए?'], true)
   + txt('f-dispcount', 'number', '7', ' min="0" max="7" step="1"')
   + lab(['How many mattress salesperson work here?', 'यहाँ कितने गद्दा सेल्सपर्सन काम करते हैं?'], true)
   + txt('f-staff', 'number', '2', ' min="0" step="1"');
  },
  validate: function(){
   var errs = [];
   var disp = getVal('f-dispcount');
   if (!/^\d+$/.test(disp) || parseInt(disp, 10) > 7) errs.push('f-dispcount');
   if (!/^\d+$/.test(getVal('f-staff'))) errs.push('f-staff');
   return errs;
  }
},
{
  title: ['Your trade', 'आपका कारोबार'],
  html: function(){ return ''
   + lab(['Years in the mattress trade', 'गद्दे के कारोबार में कितने साल'], true)
   + txt('f-years', 'number', '6', ' min="0" step="1"')
   + lab(['Which brands do you keep?', 'आप कौन से ब्रांड रखते हैं?'], false)
   + chips('brands', [['Sleepwell','स्लीपवेल'],['Kurlon','कुर्लऑन'],['Duroflex','ड्यूरोफ्लेक्स'],['Peps','पेप्स'],
                      ['Springfit','स्प्रिंगफिट'],['Centuary','सेंचुरी'],['Nilkamal','नीलकमल'],['Wakefit','वेकफिट'],
                      ['Sleepyhead','स्लीपीहेड'],['Coirfit','कॉयरफिट'],['Repose','रिपोज़'],['Restolex','रेस्टोलेक्स'],
                      ['King Koil','किंग कॉयल'],['Springwel','स्प्रिंगवेल'],['Livpure','लिवप्योर'],['Emma','एम्मा'],
                      ['Boston','बोस्टन'],['Local','लोकल']], -2)
   + lab(['Any other brand?', 'कोई अन्य ब्रांड?'], false)
   + txt('f-brandsother', 'text', '')
   + lab(['Mattress pairs sold in a month', 'महीने में बिकने वाले गद्दों के जोड़े'], false)
   + chips('vol', [['Under 10','10 से कम'],['10–25','10–25'],['25–50','25–50'],['50+','50+']], -1)
   + lab(['How many Foamico and VedaSleep mattresses do you sell in a month?', 'आप महीने में कितने फोमिको और वेदस्लीप गद्दे बेचते हैं?'], true)
   + txt('f-fv', 'number', '4', ' min="0" step="1"');
  },
  validate: function(){
   var errs = [];
   if (!/^\d+$/.test(getVal('f-years'))) errs.push('f-years');
   if (!/^\d+$/.test(getVal('f-fv'))) errs.push('f-fv');
   return errs;
  }
},
{
  title: ['The Gallery commitment', 'गैलरी प्रतिबद्धता'],
  html: function(){ return ''
   + '<div class="hero"><b>' + (lang==='en' ? 'Qualify at 8 pairs per month.' : '8 जोड़े प्रति माह पर योग्य बनें।') + '</b><p>'
   + (lang==='en' ? 'Any mattress pair, across models from the Foamico and VedaSleep series. A minimum of 8 pairs qualifies your store as a Foamico Gallery.'
                  : 'फोमिको और वेदस्लीप श्रृंखला के किसी भी मॉडल का कोई भी गद्दा जोड़ा। न्यूनतम 8 जोड़े आपकी दुकान को फोमिको गैलरी के रूप में योग्य बनाते हैं।')
   + '</p></div>'
   + '<div class="rsec-title">' + (lang==='en' ? 'Rewards you unlock' : 'जो रिवॉर्ड आप अनलॉक करते हैं') + '</div>'
   + rwd('1', ['Exclusive Marketing Support', 'विशेष मार्केटिंग सहायता'],
              ['Get 15 branding kit items and 7 display mattresses within two weeks of enrolment.',
               'नामांकन के दो सप्ताह के भीतर 15 ब्रांडिंग किट सामग्री और 7 डिस्प्ले गद्दे पाएं।'])
   + rwd('2', ['Earn free Duro Classic pairs', 'मुफ़्त ड्यूरो क्लासिक जोड़े पाएं'],
              ['Achieve the per-category slab and receive a free pair of Duro Classic every month.',
               'प्रति-श्रेणी स्लैब हासिल करें और हर महीने ड्यूरो क्लासिक का एक मुफ़्त जोड़ा पाएं।'])
   + rwd('3', ['Qualify for the Vision Trip', 'विज़न ट्रिप के लिए योग्य बनें'],
              ['Achieve 20 premium mattress pairs across Sova Natural, Ultima Natural, and Riva during the financial year to earn an exclusive trip with the Managing Director and senior leadership team.',
               'वित्तीय वर्ष के दौरान सोवा नेचुरल, अल्टिमा नेचुरल और रीवा में 20 प्रीमियम गद्दे के जोड़े हासिल करें और प्रबंध निदेशक व वरिष्ठ नेतृत्व टीम के साथ एक विशेष यात्रा अर्जित करें।'])
   + '<div class="chips" data-group="accept" style="justify-content:center">'
   + '<span class="chip' + (state.accept ? ' on' : '') + '" id="acceptChip" onclick="toggleAccept()">'
   + (lang==='en' ? 'I accept' : 'मैं स्वीकार करता हूँ') + '</span></div>';
  },
  validate: function(){
   return state.accept ? [] : ['acceptChip'];
  }
},
{
  title: ['Review and confirm', 'जाँचें और पुष्टि करें'],
  html: function(){
   var ownerDisp = state.fields['f-ownername'] || '';
   var mobileDisp = state.fields['f-mobile'] || '';
   var addrDisp = state.fields['f-address'] || '';
   var landmarkDisp = state.fields['f-landmark'] || '';
   var pinDisp = state.fields['f-pincode'] || '';
   var locationLine = [state.pincodeDistrict, state.pincodeState].filter(function(v){ return v; }).join(', ');
   if (pinDisp) locationLine = (locationLine ? locationLine + ' ' : '') + pinDisp;
   var fvCount = state.fields['f-fv'] || '';
   var commitLine = fvCount
     ? (lang==='en' ? (fvCount + ' pairs a month') : (fvCount + ' जोड़े प्रति माह'))
     : (lang==='en' ? 'your monthly commitment' : 'आपकी मासिक प्रतिबद्धता');
   return ''
   + '<div class="summary">' + escAttr(ownerDisp) + '<br><em>' + escAttr(mobileDisp) + '<br>'
   + escAttr(addrDisp) + (landmarkDisp ? (', ' + escAttr(landmarkDisp)) : '') + '<br>'
   + escAttr(locationLine) + '<br>' + escAttr(commitLine) + '</em></div>'
   + lab(['You must tick this to finish', 'पूरा करने के लिए इसे टिक करना ज़रूरी है'], true)
   + '<div class="declare' + (state.confirmed ? ' on' : '') + '" onclick="toggleConfirm()"><div class="cbox"></div><div class="dtext">'
   + (lang==='en'
      ? 'I confirm the details above are correct, accept Foamico trade terms and pricing, and commit to ' + escAttr(commitLine) + '.'
      : 'मैं पुष्टि करता हूँ कि ऊपर दी गई जानकारी सही है, फोमिको की व्यापार शर्तें और मूल्य स्वीकार करता हूँ, और ' + escAttr(commitLine) + ' की प्रतिबद्धता करता हूँ।')
   + '</div></div>'
   + '<p style="font-size:10.5px;color:var(--sand);line-height:1.6;margin-bottom:14px">'
   + (lang==='en' ? 'Trade terms v2.1 · recorded with your verified number, time, location and device.'
                  : 'व्यापार शर्तें v2.1 · आपके सत्यापित नंबर, समय, स्थान और डिवाइस के साथ दर्ज।') + '</p>';
  }
}
];

function lab(pair, required){
  return '<span class="lab">' + pair[lang==='en'?0:1]
       + (required ? '<span class="req">' + t('req') + '</span>' : '') + '</span>';
}
function card(cls, pair){
  return '<div class="info ' + cls + '">' + pair[lang==='en'?0:1] + '</div>';
}
function rwd(num, titlePair, descPair){
  return '<div class="rwd"><div class="num">' + num + '</div><div class="rtext"><b>'
       + titlePair[lang==='en'?0:1] + '</b><p>' + descPair[lang==='en'?0:1] + '</p></div></div>';
}
function chips(group, items, selected){
  var multi = selected === -2;
  var preset = {};
  var stored = state.fields[group];
  var h = '<div class="chips" data-group="' + group + '">';
  for (var i = 0; i < items.length; i++){
    var on;
    if (stored !== undefined){
      on = multi ? (Array.isArray(stored) && stored.indexOf(items[i][0]) > -1) : stored === items[i][0];
    } else {
      on = multi ? (preset[group] || []).indexOf(i) > -1 : i === selected;
    }
    h += '<span class="chip' + (on ? ' on' : '') + '" data-value="' + escAttr(items[i][0]) + '" onclick="pickChip(this,' + multi + ')">'
       + items[i][lang==='en'?0:1] + '</span>';
  }
  return h + '</div>';
}
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function txt(id, type, dflt, extra){
  // dflt no longer renders as a placeholder — an unedited field must look
  // and stay empty, since state.fields[id] only gets set on a real edit
  // and that's what actually goes into the submission payload.
  var v = state.fields.hasOwnProperty(id) ? state.fields[id] : '';
  return '<input type="' + type + '" id="' + id + '" value="' + escAttr(v) + '" oninput="onField(this)"' + (extra || '') + '>';
}
function mobileInput(){
  var v = state.fields.hasOwnProperty('f-mobile') ? state.fields['f-mobile'] : '';
  return '<input type="tel" id="f-mobile" value="' + escAttr(v) + '" maxlength="11"'
       + ' oninput="onMobileInput(this)">';
}
function otpInput(){
  var v = state.fields.hasOwnProperty('f-otp') ? state.fields['f-otp'] : '';
  return '<input type="text" id="f-otp" value="' + escAttr(v) + '" maxlength="6" style="letter-spacing:.5em"'
       + ' oninput="onOtpInput(this)" onblur="onOtpBlur(this)"'
       + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();verifyOtpNow();}">';
}
function pincodeInput(){
  var v = state.fields.hasOwnProperty('f-pincode') ? state.fields['f-pincode'] : '';
  return '<input type="text" id="f-pincode" value="' + escAttr(v) + '" maxlength="6" inputmode="numeric"'
       + ' style="margin-bottom:6px" oninput="onPincodeInput(this)">';
}
function getVal(id){
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function digitsOnly(s){ return s.replace(/\D/g, ''); }
function onField(el){
  state.fields[el.id] = el.value;
  el.classList.remove('err');
  saveProgress();
}

var OTP_RESEND_SECONDS = 30;
var otpResendTimer = null;

function setOtpSendStatus(msg, isErr){
  var el = document.getElementById('otpSendStatus');
  if (el){ el.textContent = msg || ''; el.style.color = isErr ? '#C0392B' : 'var(--avocado)'; }
}
function setOtpVerifyStatus(msg, isErr){
  var el = document.getElementById('otpVerifyStatus');
  if (el){ el.textContent = msg || ''; el.style.color = isErr ? '#C0392B' : 'var(--avocado)'; }
}
function clearVerification(){
  state.mobileVerified = false;
  state.verifiedMobile = null;
  state.verifyToken = null;
  state.verifyTokenExpiresAt = null;
  var vc = document.getElementById('mobileVerifiedCard');
  if (vc) vc.style.display = 'none';
  setOtpVerifyStatus('', false);
  saveProgress();
}
function onMobileInput(el){
  onField(el);
  if (state.mobileVerified && state.verifiedMobile !== digitsOnly(el.value)) clearVerification();
}
function onOtpInput(el){
  onField(el);
  if (digitsOnly(el.value).length === 6) verifyOtpNow();
}
function onOtpBlur(el){
  if (digitsOnly(el.value).length === 6 && !state.mobileVerified) verifyOtpNow();
}

function sendOtp(){
  var mobile = digitsOnly(getVal('f-mobile'));
  if (mobile.length !== 10){
    var mEl = document.getElementById('f-mobile');
    if (mEl) mEl.classList.add('err');
    setOtpSendStatus(lang==='en' ? 'Enter a valid 10-digit mobile number.' : 'सही 10 अंकों का मोबाइल नंबर डालें।', true);
    return;
  }
  var btn = document.getElementById('sendCodeBtn');
  setOtpSendStatus(lang==='en' ? 'Sending code…' : 'कोड भेजा जा रहा है…', false);
  fetch('/api/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mobile: mobile })
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){ return { ok: r.ok, data: data }; });
  }).then(function(res){
    if (res.ok && res.data && res.data.sent){
      setOtpSendStatus(lang==='en' ? 'Code sent on WhatsApp.' : 'व्हाट्सएप पर कोड भेजा गया।', false);
      startResendCooldown();
    } else {
      setOtpSendStatus((res.data && res.data.message) || (lang==='en' ? 'Could not send code. Try again.' : 'कोड नहीं भेजा जा सका। दोबारा कोशिश करें।'), true);
    }
  }).catch(function(){
    setOtpSendStatus(lang==='en' ? 'Network error. Try again.' : 'नेटवर्क त्रुटि। दोबारा कोशिश करें।', true);
  });
}
function startResendCooldown(){
  var btn = document.getElementById('sendCodeBtn');
  var remaining = OTP_RESEND_SECONDS;
  if (otpResendTimer) clearInterval(otpResendTimer);
  function tick(){
    if (!btn) { clearInterval(otpResendTimer); return; }
    if (remaining <= 0){
      clearInterval(otpResendTimer);
      btn.textContent = lang==='en' ? 'Resend code' : 'कोड फिर भेजें';
      btn.onclick = sendOtp;
      btn.style.pointerEvents = '';
      btn.style.opacity = '';
      return;
    }
    btn.style.pointerEvents = 'none';
    btn.style.opacity = '.5';
    btn.textContent = (lang==='en' ? 'Resend in ' : 'फिर भेजें ') + remaining + 's';
    remaining--;
  }
  tick();
  otpResendTimer = setInterval(tick, 1000);
}
function verifyOtpNow(){
  var mobile = digitsOnly(getVal('f-mobile'));
  var otp = digitsOnly(getVal('f-otp'));
  if (mobile.length !== 10 || otp.length !== 6) return;
  setOtpVerifyStatus(lang==='en' ? 'Verifying…' : 'सत्यापित हो रहा है…', false);
  fetch('/api/verify-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mobile: mobile, otp: otp })
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){ return { ok: r.ok, data: data }; });
  }).then(function(res){
    if (res.ok && res.data && res.data.verified){
      state.mobileVerified = true;
      state.verifiedMobile = res.data.mobile || mobile;
      state.verifyToken = res.data.token || null;
      state.verifyTokenExpiresAt = res.data.expiresAt || null;
      setOtpVerifyStatus('', false);
      saveProgress();
      render();
    } else {
      state.mobileVerified = false;
      setOtpVerifyStatus((res.data && res.data.message) || (lang==='en' ? 'Incorrect code. Try again.' : 'गलत कोड। दोबारा कोशिश करें।'), true);
      var oEl = document.getElementById('f-otp');
      if (oEl) oEl.classList.add('err');
    }
  }).catch(function(){
    setOtpVerifyStatus(lang==='en' ? 'Network error. Try again.' : 'नेटवर्क त्रुटि। दोबारा कोशिश करें।', true);
  });
}

function setPincodeStatus(msg, isErr){
  var el = document.getElementById('pincodeStatus');
  if (el){ el.textContent = msg || ''; el.style.color = isErr ? '#C0392B' : 'var(--avocado)'; }
}
function clearPincodeLookup(){
  state.verifiedPincode = null;
  state.pincodeDistrict = null;
  state.pincodeState = null;
  var rc = document.getElementById('pincodeResultCard');
  if (rc) rc.style.display = 'none';
  setPincodeStatus('', false);
  saveProgress();
}
function onPincodeInput(el){
  var raw = digitsOnly(el.value).slice(0, 6);
  if (el.value !== raw) el.value = raw;
  state.fields[el.id] = raw;
  el.classList.remove('err');

  if (state.verifiedPincode && state.verifiedPincode !== raw){
    clearPincodeLookup();
  } else {
    saveProgress();
  }

  if (raw.length === 6 && state.verifiedPincode !== raw){
    lookupPincodeNow(raw);
  } else if (raw.length !== 6) {
    setPincodeStatus('', false);
  }
}
function lookupPincodeNow(pincode){
  setPincodeStatus(lang==='en' ? 'Looking up pincode…' : 'पिन कोड खोजा जा रहा है…', false);
  fetch('/api/lookup-pincode?pincode=' + encodeURIComponent(pincode))
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){ return { ok: r.ok, data: data }; });
    }).then(function(res){
      if (digitsOnly(getVal('f-pincode')) !== pincode) return; // stale response, user kept typing
      if (res.ok && res.data && res.data.found){
        state.verifiedPincode = pincode;
        state.pincodeDistrict = res.data.district;
        state.pincodeState = res.data.state;
        setPincodeStatus('', false);
        saveProgress();
        render();
      } else {
        state.verifiedPincode = null;
        state.pincodeDistrict = null;
        state.pincodeState = null;
        setPincodeStatus((res.data && res.data.message) || (lang==='en' ? 'Pincode not found.' : 'पिन कोड नहीं मिला।'), true);
        var pEl = document.getElementById('f-pincode');
        if (pEl) pEl.classList.add('err');
      }
    }).catch(function(){
      setPincodeStatus(lang==='en' ? 'Network error. Try again.' : 'नेटवर्क त्रुटि। दोबारा कोशिश करें।', true);
    });
}

function saveProgress(){
  try {
    var data = {
      step: step, lang: lang, fields: state.fields,
      confirmed: state.confirmed, unmarried: state.unmarried, accept: state.accept,
      mobileVerified: state.mobileVerified, verifiedMobile: state.verifiedMobile,
      verifyToken: state.verifyToken, verifyTokenExpiresAt: state.verifyTokenExpiresAt,
      verifiedPincode: state.verifiedPincode, pincodeDistrict: state.pincodeDistrict, pincodeState: state.pincodeState
    };
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  } catch(e){}
}
function loadProgress(){
  try {
    var raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (!data) return;
    var verifyExpired = data.verifyTokenExpiresAt && Date.now() > data.verifyTokenExpiresAt;
    step = data.step || 0;
    lang = data.lang || 'en';
    state.fields = data.fields || {};
    state.confirmed = !!data.confirmed;
    state.unmarried = !!data.unmarried;
    state.accept = !!data.accept;
    state.mobileVerified = verifyExpired ? false : !!data.mobileVerified;
    state.verifiedMobile = verifyExpired ? null : (data.verifiedMobile || null);
    state.verifyToken = verifyExpired ? null : (data.verifyToken || null);
    state.verifyTokenExpiresAt = verifyExpired ? null : (data.verifyTokenExpiresAt || null);
    state.verifiedPincode = data.verifiedPincode || null;
    state.pincodeDistrict = data.pincodeDistrict || null;
    state.pincodeState = data.pincodeState || null;
  } catch(e){}
}

function pickChip(el, multi){
  var container = el.parentNode;
  if (multi) {
    el.classList.toggle('on');
  } else {
    var sibs = container.children;
    var wasOn = el.classList.contains('on');
    for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove('on');
    if (!(wasOn && sibs.length === 1)) el.classList.add('on');
  }

  var group = container.getAttribute('data-group');
  if (group){
    var onEls = container.querySelectorAll('.chip.on');
    if (multi){
      var vals = [];
      for (var j = 0; j < onEls.length; j++) vals.push(onEls[j].getAttribute('data-value'));
      state.fields[group] = vals;
    } else {
      state.fields[group] = onEls.length ? onEls[0].getAttribute('data-value') : null;
    }
    saveProgress();
  }
}
function toggleConfirm(){ state.confirmed = !state.confirmed; render(); }
function toggleMarried(){ state.unmarried = !state.unmarried; render(); }
function toggleAccept(){ state.accept = !state.accept; render(); }

function showBanner(){
  var b = document.getElementById('errbanner');
  if (!b) return;
  b.textContent = t('errmsg');
  b.classList.remove('hidden');
}
function hideBanner(){
  var b = document.getElementById('errbanner');
  if (b) b.classList.add('hidden');
}

function render(){
  var s = STEPS[step];
  document.getElementById('stepno').textContent = t('stepof').replace('#', step + 1).replace('@', STEPS.length);
  document.getElementById('steptitle').textContent = s.title[lang==='en'?0:1];
  document.getElementById('fill').style.width = ((step + 1) / STEPS.length * 100) + '%';

  var last = step === STEPS.length - 1;
  var btn = last
    ? '<button class="cta" ' + (state.confirmed ? '' : 'disabled') + ' onclick="finish()">'
      + (lang==='en' ? 'Submit registration' : 'पंजीकरण जमा करें') + '</button>'
    : '<button class="cta" onclick="next()">' + t('cont') + '</button>';
  var back = step > 0 ? '<button class="back" onclick="prev()">← ' + t('back') + '</button>' : '';

  document.getElementById('body').innerHTML = '<div id="errbanner" class="errbanner hidden"></div>' + s.html() + btn + back;
  saveProgress();
}

function next(){
  var s = STEPS[step];
  var body = document.getElementById('body');
  var prevErrs = body.querySelectorAll('.err');
  for (var i = 0; i < prevErrs.length; i++) prevErrs[i].classList.remove('err');

  var errs = s.validate ? s.validate() : [];
  if (errs.length){
    for (var j = 0; j < errs.length; j++){
      var el = document.getElementById(errs[j]);
      if (el) el.classList.add('err');
    }
    showBanner();
    var first = document.getElementById(errs[0]);
    if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  hideBanner();
  if (step < STEPS.length - 1){ step++; render(); window.scrollTo(0,0); }
}
function prev(){ if (step > 0){ step--; render(); window.scrollTo(0,0); } }

function buildSubmissionPayload(){
  return {
    mobile: digitsOnly(state.fields['f-mobile'] || ''),
    mobileVerified: !!state.mobileVerified,
    verifiedMobile: state.verifiedMobile || null,
    verifyToken: state.verifyToken || null,

    ownerName: state.fields['f-ownername'] || '',
    dob: state.fields['f-dob'] || '',
    unmarried: !!state.unmarried,
    anniversary: state.unmarried ? null : (state.fields['f-anniv'] || ''),
    altNumber: state.fields['f-altnum'] || '',
    email: state.fields['f-email'] || '',

    pincode: state.fields['f-pincode'] || '',
    district: state.pincodeDistrict || null,
    state: state.pincodeState || null,
    address: state.fields['f-address'] || '',
    landmark: state.fields['f-landmark'] || '',

    shopSize: state.fields['size'] || null,
    displayCount: state.fields['f-dispcount'] || '',
    staffCount: state.fields['f-staff'] || '',

    yearsInTrade: state.fields['f-years'] || '',
    brands: state.fields['brands'] || [],
    brandsOther: state.fields['f-brandsother'] || '',
    monthlyVolume: state.fields['vol'] || null,
    monthlyFoamicoVedasleep: state.fields['f-fv'] || '',

    galleryAccept: !!state.accept,
    confirmed: !!state.confirmed,
    lang: lang
  };
}

function finish(){
  if (!state.confirmed) return;
  var btn = document.querySelector('#body .cta');
  if (btn){ btn.disabled = true; btn.textContent = lang==='en' ? 'Submitting…' : 'जमा हो रहा है…'; }
  hideBanner();

  fetch('/api/submit-registration', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildSubmissionPayload())
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(data){ return { ok: r.ok, data: data }; });
  }).then(function(res){
    if (!res.ok || !res.data || !res.data.success){
      if (btn){ btn.disabled = false; btn.textContent = lang==='en' ? 'Submit registration' : 'पंजीकरण जमा करें'; }
      var b = document.getElementById('errbanner');
      if (b){
        b.textContent = (res.data && res.data.message) || (lang==='en' ? 'Could not submit right now. Please try again.' : 'अभी जमा नहीं हो सका। कृपया दोबारा कोशिश करें।');
        b.classList.remove('hidden');
      }
      return;
    }
    try { localStorage.removeItem(PROGRESS_KEY); } catch(e){}
    showDoneScreen(res.data.dealerCode);
  }).catch(function(){
    if (btn){ btn.disabled = false; btn.textContent = lang==='en' ? 'Submit registration' : 'पंजीकरण जमा करें'; }
    var b = document.getElementById('errbanner');
    if (b){
      b.textContent = lang==='en' ? 'Network error. Please try again.' : 'नेटवर्क त्रुटि। कृपया दोबारा कोशिश करें।';
      b.classList.remove('hidden');
    }
  });
}
function showDoneScreen(dealerCode){
  var code = dealerCode || 'FOA-PENDING';
  var firstName = (state.fields['f-ownername'] || '').trim().split(/\s+/)[0] || '';
  var dispCount = parseInt(state.fields['f-dispcount'], 10);
  if (!Number.isFinite(dispCount) || dispCount < 0) dispCount = 7;
  document.getElementById('stepno').textContent = lang==='en' ? 'Enrolled' : 'दर्ज हुआ';
  document.getElementById('steptitle').textContent = lang==='en' ? 'Welcome to Foamico Gallery' : 'फोमिको गैलरी में स्वागत है';
  document.getElementById('fill').style.width = '100%';
  document.getElementById('body').innerHTML =
    '<div class="done-wrap"><div class="done-ring"></div>'
  + '<h4>' + escAttr(code) + '</h4>'
  + '<p>' + (lang==='en'
      ? 'Your dealer code. Keep it for any question about your Gallery.'
      : 'यह आपका डीलर कोड है। गैलरी से जुड़े किसी भी सवाल के लिए इसे रखें।') + '</p>'
  + '<div class="wa"><span>' + (lang==='en' ? 'WhatsApp · just now' : 'व्हाट्सएप · अभी') + '</span><br>'
  + (lang==='en'
      ? 'Welcome, ' + escAttr(firstName) + ' ji. Your Foamico Gallery is registered as ' + escAttr(code) + '.<br><br>Our team will call you within 48 hours to say hello and check a few details.<br><br>Your branding kit and ' + dispCount + ' display mattresses arrive within 14 days.'
      : 'नमस्ते ' + escAttr(firstName) + ' जी। आपकी फोमिको गैलरी ' + escAttr(code) + ' के रूप में दर्ज हो गई है।<br><br>हमारी टीम 48 घंटे में आपसे बात करने और कुछ जानकारी जाँचने के लिए कॉल करेगी।<br><br>आपकी ब्रांडिंग किट और ' + dispCount + ' डिस्प्ले गद्दे 14 दिन में पहुँचेंगे।')
  + '</div>'
  + '<button class="cta" style="margin-top:18px" onclick="restart()">'
  + (lang==='en' ? 'Start again' : 'फिर से शुरू करें') + '</button></div>';
}
function restart(){
  step = 0;
  state = {
    confirmed: false, unmarried: false, accept: false, fields: {},
    mobileVerified: false, verifiedMobile: null, verifyToken: null, verifyTokenExpiresAt: null,
    verifiedPincode: null, pincodeDistrict: null, pincodeState: null
  };
  try { localStorage.removeItem(PROGRESS_KEY); } catch(e){}
  render();
}

function setLang(l){
  lang = l;
  render();
}

loadProgress();
render();
</script>
</body>
</html>
